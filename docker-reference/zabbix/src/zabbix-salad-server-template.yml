zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    - uuid: f2f4af0b06054c9390842d489e5d4284
      template: salad-server
      name: salad-server
      templates:
        - name: 'Docker by Zabbix agent 2'
        - name: 'Linux by Zabbix agent'
      groups:
        - name: Templates
      items:
        - uuid: d8d06344dc4f48c9bf3d3f3b7ec056f1
          name: 'Host only CPU usage'
          type: CALCULATED
          key: cpu.host.usage
          units: '%'
          params: 'last(//system.cpu.num)*last(//system.cpu.util)-sum(last_foreach(//docker.container_stats.cpu_pct_usage[*]))'
          tags:
            - tag: component
              value: cpu
        - uuid: 13d91be1252b464e94efb9c3097115b3
          name: 'Host only CPU core usage'
          type: CALCULATED
          key: cpu.host.usage.core
          value_type: FLOAT
          units: core
          params: last(//cpu.host.usage)/100
          tags:
            - tag: component
              value: cpu
        - uuid: 2d78212497bf41aeb83ea8c09d69419f
          name: 'Disks raw'
          key: disks.raw
          delay: 15m
          value_type: TEXT
          timeout: 30s
          tags:
            - tag: component
              value: disk
        - uuid: e1976492ea5f467885887cd9afe83de4
          name: 'Disks on standby'
          type: CALCULATED
          key: disks.standby.count
          params: 'sum(last_foreach(//disks.value[*,standby]))'
          tags:
            - tag: component
              value: disk
        - uuid: e2ecf25e45cc415b8c32d061b120f94e
          name: 'Docker containers raw'
          key: docker.containers.raw
          value_type: TEXT
        - uuid: 75e8ff45e553476c833f367b841d80eb
          name: 'Filesystems raw'
          key: filesystems.raw
          delay: 5m
          value_type: TEXT
          tags:
            - tag: component
              value: filesystem
        - uuid: 9aa8f9839bf14e28b73f81138f3f78a6
          name: 'Host only memory usage'
          type: CALCULATED
          key: host.memory.usage
          units: B
          params: 'last(//vm.memory.size[total])-last(//vm.memory.size[available])-sum(last_foreach(//docker.container_stats.memory.usage_total[*]))'
          tags:
            - tag: component
              value: memory
        - uuid: f6358a335bbc457c9b981116b50f4079
          name: 'Host network out'
          type: CALCULATED
          key: host.network.out
          units: B
          params: 'last(//net.if.out["enp4s0"])'
        - uuid: ac65c7b725844d189a799315e20bd679
          name: 'Swap usage'
          type: CALCULATED
          key: host.swap.usage
          units: B
          params: 'last(//system.swap.size[,total])-last(//system.swap.size[,free])'
          tags:
            - tag: component
              value: memory
        - uuid: 920249df16f841e39802c3c18356c37d
          name: 'Host network in'
          type: CALCULATED
          key: host.wan.in
          units: B
          params: 'last(//net.if.in["enp4s0"])'
        - uuid: cb17532d4ccc446695e560bff9fcb3de
          name: 'mdadm raw'
          key: mdadm.raw
          value_type: JSON
          tags:
            - tag: component
              value: mdadm
        - uuid: cd10770936574e2b9f9396938a4a05e2
          name: 'Temperatures raw'
          key: temperatures.raw
          value_type: JSON
          tags:
            - tag: component
              value: temperature
      discovery_rules:
        - uuid: 22247f8be59e4185ba88d34ed3932709
          name: 'Disks discovery'
          type: DEPENDENT
          key: disks.discovery
          item_prototypes:
            - uuid: 5751265e450f49a792b964b921b6b4d8
              name: 'Disk {#NAME}: Standby % 30d'
              type: CALCULATED
              key: 'disks.standby.pct["{#NAME}"]'
              units: '%'
              params: '100*avg(//disks.value["{#NAME}",standby],30d)'
              tags:
                - tag: component
                  value: disk
                - tag: device
                  value: '{#DEVICE}'
                - tag: disk
                  value: '{#NAME}'
            - uuid: b629c90200ff4f7ba742eb4248c5822e
              name: 'Disk {#NAME}: Device'
              type: DEPENDENT
              key: 'disks.value["{#NAME}",device]'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[''{#NAME}''].device'
              master_item:
                key: disks.raw
              tags:
                - tag: component
                  value: disk
                - tag: device
                  value: '{#DEVICE}'
                - tag: disk
                  value: '{#NAME}'
            - uuid: 69ac648b052e4b6abd7fea4fcec80f24
              name: 'Disk {#NAME}: Healthy'
              type: DEPENDENT
              key: 'disks.value["{#NAME}",healthy]'
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[''{#NAME}''].healthy'
                  error_handler: DISCARD_VALUE
                - type: STR_REPLACE
                  parameters:
                    - 'true'
                    - '1'
                - type: STR_REPLACE
                  parameters:
                    - 'false'
                    - '0'
              master_item:
                key: disks.raw
              tags:
                - tag: component
                  value: disk
                - tag: device
                  value: '{#DEVICE}'
                - tag: disk
                  value: '{#NAME}'
            - uuid: 3b10b248a493417ab2e62bd9b387ce51
              name: 'Disk {#NAME}: Model'
              type: DEPENDENT
              key: 'disks.value["{#NAME}",model]'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[''{#NAME}''].model_name'
                  error_handler: DISCARD_VALUE
              master_item:
                key: disks.raw
              tags:
                - tag: component
                  value: disk
                - tag: device
                  value: '{#DEVICE}'
                - tag: disk
                  value: '{#NAME}'
            - uuid: e96113698bf14b84a994b82a32d5e3ac
              name: 'Disk {#NAME}: Power on hours'
              type: DEPENDENT
              key: 'disks.value["{#NAME}",power_on_hours]'
              units: '!h'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[''{#NAME}''].power_on_hours'
                  error_handler: DISCARD_VALUE
              master_item:
                key: disks.raw
              tags:
                - tag: component
                  value: disk
                - tag: device
                  value: '{#DEVICE}'
                - tag: disk
                  value: '{#NAME}'
            - uuid: 8aabb5c492254bb99c074bc778ee9223
              name: 'Disk {#NAME}: Protocol'
              type: DEPENDENT
              key: 'disks.value["{#NAME}",protocol]'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[''{#NAME}''].protocol'
                  error_handler: DISCARD_VALUE
              master_item:
                key: disks.raw
              tags:
                - tag: component
                  value: disk
                - tag: device
                  value: '{#DEVICE}'
                - tag: disk
                  value: '{#NAME}'
            - uuid: e2e1b62b892d4053b7428ae20cac25e1
              name: 'Disk {#NAME}: Serial number'
              type: DEPENDENT
              key: 'disks.value["{#NAME}",sn]'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[''{#NAME}''].serial_number'
                  error_handler: DISCARD_VALUE
              master_item:
                key: disks.raw
              tags:
                - tag: component
                  value: disk
                - tag: device
                  value: '{#DEVICE}'
                - tag: disk
                  value: '{#NAME}'
            - uuid: 08664617f0ca40c588d102de0d73b32e
              name: 'Disk {#NAME}: Standby'
              type: DEPENDENT
              key: 'disks.value["{#NAME}",standby]'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[''{#NAME}''].standby'
                - type: STR_REPLACE
                  parameters:
                    - 'true'
                    - '1'
                - type: STR_REPLACE
                  parameters:
                    - 'false'
                    - '0'
              master_item:
                key: disks.raw
              tags:
                - tag: component
                  value: disk
                - tag: device
                  value: '{#DEVICE}'
                - tag: disk
                  value: '{#NAME}'
            - uuid: 3e7ec25bef6049f4b663e51f3d329024
              name: 'Disk {#NAME}: Status'
              type: CALCULATED
              key: 'disks.value["{#NAME}",status]'
              params: '2*(1-last(//disks.value["{#NAME}",healthy])) + last(//disks.value["{#NAME}",healthy])*last(//disks.value["{#NAME}",warn])'
              description: |
                0 -> healthy
                1 -> warning
                2 -> unhealthy
              valuemap:
                name: 'Disk status'
              tags:
                - tag: component
                  value: disk
                - tag: device
                  value: '{#DEVICE}'
                - tag: disk
                  value: '{#NAME}'
            - uuid: b0ed9de7200f4f8baf3cb886d4f59215
              name: 'Disk {#NAME}: Temperature'
              type: DEPENDENT
              key: 'disks.value["{#NAME}",temp]'
              units: °C
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[''{#NAME}''].temperature'
                  error_handler: DISCARD_VALUE
              master_item:
                key: disks.raw
              tags:
                - tag: component
                  value: disk
                - tag: device
                  value: '{#DEVICE}'
                - tag: disk
                  value: '{#NAME}'
            - uuid: 1f5af5513c7e4e608799e8d3a7b8d146
              name: 'Disk {#NAME}: Warning'
              type: DEPENDENT
              key: 'disks.value["{#NAME}",warn]'
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[''{#NAME}''].warning'
                  error_handler: DISCARD_VALUE
                - type: STR_REPLACE
                  parameters:
                    - 'true'
                    - '1'
                - type: STR_REPLACE
                  parameters:
                    - 'false'
                    - '0'
              master_item:
                key: disks.raw
              tags:
                - tag: component
                  value: disk
                - tag: device
                  value: '{#DEVICE}'
                - tag: disk
                  value: '{#NAME}'
          master_item:
            key: disks.raw
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var output = { "data": [] };
                  const parsedValue = JSON.parse(value);
                  const targets = Object.keys(parsedValue);
                  for (var i=0; i < targets.length; i++) {
                  	const target = targets[i];
                  	const entry = parsedValue[target];
                  	output.data.push({
                  		"{#NAME}": target,
                  		"{#DEVICE}": entry.device
                  	});
                  }
                  return JSON.stringify(output);
        - uuid: 5cb3ed42268b4609a0921c25af24f542
          name: 'Docker containers discovery'
          type: DEPENDENT
          key: docker.containers.discovery
          item_prototypes:
            - uuid: a44a855fb5fd4d2ca9e00b297efd9e73
              name: 'Container {#NAME}: Backup age'
              type: CALCULATED
              key: 'containers.backup["{#NAME}",age]'
              value_type: FLOAT
              units: d
              params: '(now()-last(//containers.backup["{#NAME}",date]))/86400'
              tags:
                - tag: component
                  value: backup
                - tag: container
                  value: '{#NAME}'
            - uuid: 5e75fbbca80d44499802d2dd25bc8140
              name: 'Container {#NAME}: Backup date'
              type: DEPENDENT
              key: 'containers.backup["{#NAME}",date]'
              trends: '0'
              units: unixtime
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[''{#ID}''].last_backup'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var iso = value.trim().replace(" ", "T") + "Z";
                      var ms = Date.parse(iso);
                      if (isNaN(ms)) {
                          return 0; // Will be reported as "never".
                      }
                      return Math.floor(ms / 1000);
              master_item:
                key: docker.containers.raw
              tags:
                - tag: component
                  value: backup
                - tag: container
                  value: '{#NAME}'
            - uuid: 89583ae9f70e42bcad5db6a25a5d2356
              name: 'Container {#NAME}: Image age'
              type: CALCULATED
              key: 'containers.image["{#NAME}",age]'
              value_type: FLOAT
              units: d
              params: '(now()-last(//containers.image["{#NAME}",creation]))/86400'
              tags:
                - tag: component
                  value: images
                - tag: container
                  value: '{#NAME}'
            - uuid: 1ead0c322f4e43dca7d411c84dec5160
              name: 'Container {#NAME}: Image creation date'
              type: DEPENDENT
              key: 'containers.image["{#NAME}",creation]'
              trends: '0'
              units: unixtime
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[''{#ID}''].image.creation_date'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var iso = value.trim().replace(" ", "T") + "Z";
                      var ms = Date.parse(iso);
                      if (isNaN(ms)) {
                          throw "Cannot parse image creation date: " + value;
                      }
                      return Math.floor(ms / 1000);
              master_item:
                key: docker.containers.raw
              tags:
                - tag: component
                  value: images
                - tag: container
                  value: '{#NAME}'
            - uuid: d7a963d61b3140749ce196d6e759b503
              name: 'Container {#NAME}: Disk usage'
              type: DEPENDENT
              key: 'containers["{#NAME}",disk]'
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[''{#ID}''].disk_usage'
              master_item:
                key: docker.containers.raw
              tags:
                - tag: component
                  value: images
                - tag: container
                  value: '{#NAME}'
            - uuid: 464265a10002457e83904ec49ee9e577
              name: 'Container {#NAME}: Stack name'
              type: DEPENDENT
              key: 'containers["{#NAME}",stack]'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[''{#ID}''].stack_name'
              master_item:
                key: docker.containers.raw
              tags:
                - tag: component
                  value: container
                - tag: container
                  value: '{#NAME}'
          master_item:
            key: docker.containers.raw
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var output = { "data": [] };
                  const parsedValue = JSON.parse(value);
                  const targets = Object.keys(parsedValue);
                  for (var i=0; i < targets.length; i++) {
                  	const target = targets[i];
                  	const entry = parsedValue[target];
                  	output.data.push({
                  		"{#ID}": target,
                          "{#NAME}": "/" + entry.name,
                  		"{#IMAGE_ID}": entry.image.id,
                  		"{#IMAGE_NAME}": entry.image.name,
                  		"{#IMAGE_CREATION_DATE}": entry.image.creation_date
                  	});
                  }
                  return JSON.stringify(output);
        - uuid: ecd2d5ec96e7469cb36788225028cfa2
          name: 'Filesystems discovery'
          type: DEPENDENT
          key: filesystems.discovery
          description: 'Check filesystems usage with /opt/salad-server/scripts/check-disk-usage.sh'
          item_prototypes:
