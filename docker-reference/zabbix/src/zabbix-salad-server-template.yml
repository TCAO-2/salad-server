            - uuid: 8a0a5009edbe44a29cdca1475e1133c3
              name: 'mdadm {#NAME}: Spare devices'
              type: DEPENDENT
              key: 'mdadm.devices["{#NAME}",spare]'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[''{#NAME}''].failed_devices'
              master_item:
                key: mdadm.raw
              tags:
                - tag: array
                  value: '{#NAME}'
                - tag: component
                  value: mdadm
            - uuid: 94b4809341464fd5b5ef92560ed67dc7
              name: 'mdadm {#NAME}: Total devices'
              type: DEPENDENT
              key: 'mdadm.devices["{#NAME}",total]'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[''{#NAME}''].total_devices'
              master_item:
                key: mdadm.raw
              tags:
                - tag: array
                  value: '{#NAME}'
                - tag: component
                  value: mdadm
            - uuid: c7c28b27282f4522809a9e2230808728
              name: 'mdadm {#NAME}: Working devices'
              type: DEPENDENT
              key: 'mdadm.devices["{#NAME}",working]'
              preprocessing:
                - type: JSONPATH
                  parameters:
