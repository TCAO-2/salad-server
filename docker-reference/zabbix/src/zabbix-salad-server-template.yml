              master_item:
                key: filesystems.raw
              tags:
                - tag: component
                  value: filesystem
                - tag: filesystem
                  value: '{#NAME}'
          master_item:
            key: filesystems.raw
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var output = { "data": [] };
                  const parsedValue = JSON.parse(value);
                  const targets = Object.keys(parsedValue);
                  for (var i=0; i < targets.length; i++) {
                  	const target = targets[i];
                  	const entry = parsedValue[target];
                  	output.data.push({
                  		"{#NAME}": target
                  	});
                  }
                  return JSON.stringify(output);
        - uuid: 372fed90a1bf436789d20caec479f06f
          name: 'mdadm discovery'
          type: DEPENDENT
          key: mdadm.discovery
          item_prototypes:
            - uuid: d6d02b79f2b448c9b5ba9bc512646428
              name: 'mdadm {#NAME}: Array events'
              type: DEPENDENT
              key: 'mdadm.array["{#NAME}",events]'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[''{#NAME}''].events'
              master_item:
                key: mdadm.raw
              tags:
                - tag: array
                  value: '{#NAME}'
                - tag: component
                  value: mdadm
            - uuid: ab26e89423de4204ae62c5b23c341fbc
              name: 'mdadm {#NAME}: Array name'
              type: DEPENDENT
              key: 'mdadm.array["{#NAME}",name]'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[''{#NAME}''].name'
              master_item:
                key: mdadm.raw
              tags:
                - tag: array
                  value: '{#NAME}'
                - tag: component
                  value: mdadm
            - uuid: d39a8979aad44911a43c0d5331ef1211
              name: 'mdadm {#NAME}: RAID level'
              type: DEPENDENT
              key: 'mdadm.array["{#NAME}",raidlevel]'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[''{#NAME}''].raid_level'
              master_item:
                key: mdadm.raw
              tags:
                - tag: array
                  value: '{#NAME}'
                - tag: component
                  value: mdadm
            - uuid: d47c5e2944f240049cd8f2fcc85c1107
              name: 'mdadm {#NAME}: Return code'
              type: DEPENDENT
              key: 'mdadm.array["{#NAME}",returncode]'
              description: |
                0 -> The array is functioning normally.
                1 -> The array has at least one failed device.
                2 -> The array has multiple failed devices such that it is unusable.
                4 -> There was an error while trying to get information about the device.
              valuemap:
                name: 'mdadm return code'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[''{#NAME}''].mdadm_return_code'
              master_item:
                key: mdadm.raw
              tags:
                - tag: array
                  value: '{#NAME}'
                - tag: component
                  value: mdadm
            - uuid: 20212ba4a2cc4ccb8a120af599ee79e0
              name: 'mdadm {#NAME}: Array size'
              type: DEPENDENT
              key: 'mdadm.array["{#NAME}",size]'
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[''{#NAME}''].array_size'
                - type: MULTIPLIER
                  parameters:
                    - '1024'
              master_item:
                key: mdadm.raw
              tags:
                - tag: array
                  value: '{#NAME}'
                - tag: component
                  value: mdadm
            - uuid: 2f2c298b0bc8450494bc66e01a8ea9b9
              name: 'mdadm {#NAME}: Array state'
              type: DEPENDENT
              key: 'mdadm.array["{#NAME}",state]'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[''{#NAME}''].state'
              master_item:
                key: mdadm.raw
              tags:
                - tag: array
                  value: '{#NAME}'
                - tag: component
                  value: mdadm
            - uuid: 35d591680d7e4906b0f8991d019ff223
              name: 'mdadm {#NAME}: Active devices'
              type: DEPENDENT
              key: 'mdadm.devices["{#NAME}",active]'
              preprocessing:
