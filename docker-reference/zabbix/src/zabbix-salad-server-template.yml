              type: DEPENDENT
              key: 'filesystems.value["{#NAME}",avail]'
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[''{#NAME}''].avail'
              master_item:
                key: filesystems.raw
              tags:
                - tag: component
                  value: filesystem
                - tag: filesystem
                  value: '{#NAME}'
            - uuid: 2ad3b6c40f5d4201a7ccc48495597773
              name: 'Filesystem {#NAME}: Percent used'
              type: DEPENDENT
              key: 'filesystems.value["{#NAME}",pcent]'
              units: '%'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[''{#NAME}''].pcent'
              master_item:
                key: filesystems.raw
              tags:
                - tag: component
                  value: filesystem
                - tag: filesystem
                  value: '{#NAME}'
            - uuid: 5b41ae7e262c427e9c270e7be546d97c
              name: 'Filesystem {#NAME}: Size'
              type: DEPENDENT
              key: 'filesystems.value["{#NAME}",size]'
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[''{#NAME}''].size'
              master_item:
                key: filesystems.raw
              tags:
                - tag: component
                  value: filesystem
                - tag: filesystem
                  value: '{#NAME}'
            - uuid: c92a64e2188e4b66917725de0c8d3c39
              name: 'Filesystem {#NAME}: Source'
              type: DEPENDENT
              key: 'filesystems.value["{#NAME}",source]'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[''{#NAME}''].source'
              master_item:
                key: filesystems.raw
              tags:
                - tag: component
                  value: filesystem
                - tag: filesystem
                  value: '{#NAME}'
            - uuid: f10aa0ad3ce243fcaba8847acb1616a9
              name: 'Filesystem {#NAME}: Used'
              type: DEPENDENT
              key: 'filesystems.value["{#NAME}",used]'
              units: B
              preprocessing:
