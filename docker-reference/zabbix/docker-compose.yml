services:
  zabbix_postgres:
    image: postgres:18-alpine
    container_name: zabbix_postgres
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_test_only
    volumes:
      - ./postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - zabbix_backend
    restart: unless-stopped

  zabbix_server:
    image: zabbix/zabbix-server-pgsql:alpine-8.0-latest
    container_name: zabbix_server
    environment:
      DB_SERVER_HOST: zabbix_postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_test_only
    depends_on:
      zabbix_postgres:
        condition: service_healthy
    networks:
      - zabbix_backend
      - bridge
    restart: unless-stopped

  zabbix_web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-8.0-latest
    container_name: zabbix_web
    environment:
      ZBX_SERVER_HOST: zabbix_server
      DB_SERVER_HOST: zabbix_postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_test_only
      PHP_TZ: Etc/UTC
    volumes:
      - ./zabbix-web/modules:/usr/share/zabbix/modules:ro
    depends_on:
      - zabbix_server
    networks:
      - zabbix_backend
      - bridge
    restart: unless-stopped

networks:
  zabbix_backend:
    # Backend network without WAN access.
    driver: bridge
    internal: true
  bridge:
    driver: bridge
